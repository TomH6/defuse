<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Defuse — daily bomb puzzle</title>
<meta name="description" content="A daily logic puzzle: 4 wires, lying tags, one cut. Find the safe wire before the clock runs out.">
<meta property="og:title" content="DEFUSE 💣">
<meta property="og:description" content="4 wires. Lying tags. One cut. A new bomb every day.">
<meta name="theme-color" content="#070b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b0d;--panel:#0f1519;--line:#1d2a30;--text:#d8f3ea;--muted:#5f7d78;--cyan:#22e5ff;--green:#39ff9c;--amber:#ffb020;--red:#ff3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;display:flex;justify-content:center;
  background:
   linear-gradient(rgba(34,229,255,.045) 1px,transparent 1px) 0 0/22px 22px,
   linear-gradient(90deg,rgba(34,229,255,.045) 1px,transparent 1px) 0 0/22px 22px,
   radial-gradient(circle at 50% -10%,#10262b,var(--bg) 65%);background-color:var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:5}
.app{width:100%;max-width:460px;padding:14px 12px 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:24px;letter-spacing:.22em;margin:0;color:var(--cyan);text-shadow:0 0 10px #22e5ff88}
h1 span{color:var(--red);text-shadow:0 0 10px #ff3b3b99}
.sub{color:var(--muted);font-size:12px;text-align:right;letter-spacing:.08em;text-transform:uppercase}
.bomb{position:relative;margin-top:12px;background:linear-gradient(160deg,#162027,#0b1114);border:1px solid #2a3a42;border-radius:10px;padding:14px 14px 12px;
  box-shadow:0 0 0 1px #000,0 14px 34px #000c,inset 0 0 30px #22e5ff0d;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.bomb::before{content:"";position:absolute;inset:6px;border:1px dashed #22e5ff22;border-radius:6px;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--red)}
.status.ok{color:var(--green)}.status.dead{color:#777}
.led{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s infinite}
.status.ok .led{background:var(--green);box-shadow:0 0 12px var(--green);animation:none}
.status.dead .led{background:#333;box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.2}}
.timer{font-family:Orbitron,sans-serif;font-weight:700;font-size:30px;color:var(--red);background:#020303;padding:6px 14px;border-radius:4px;text-shadow:0 0 10px #ff3b3baa;letter-spacing:.08em;border:1px solid #3a1414;box-shadow:inset 0 0 12px #ff3b3b22}
.timer.ok{color:var(--green);text-shadow:0 0 10px #39ff9caa;border-color:#14402a;box-shadow:inset 0 0 12px #39ff9c22}
.timer.low{animation:blink .5s infinite}
.rule{margin:12px 0 0;background:#130f05;border:1px solid #4a3410;border-left:3px solid var(--amber);border-radius:3px;padding:8px 10px;font-size:14px;line-height:1.45;color:#ffe2a8}
.rule .h{font-size:10.5px;color:var(--amber);letter-spacing:.18em;margin-bottom:2px}
.rule b{color:var(--amber);text-shadow:0 0 6px #ffb02088}
.board{position:relative;margin:12px 0 0;height:150px;background:#071013;border:1px solid var(--line);border-radius:4px;
  background-image:linear-gradient(rgba(57,255,156,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,156,.06) 1px,transparent 1px);background-size:12px 12px}
.wires{display:flex;justify-content:space-around;height:100%;position:relative;padding:0 6px}
.board::before,.board::after{content:"";position:absolute;left:6px;right:6px;height:12px;background:linear-gradient(#59646e,#2b3238);border-radius:2px;z-index:1;box-shadow:0 1px 0 #000}
.board::before{top:6px}.board::after{bottom:6px}
.wire{position:relative;width:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:16px 0}
.wire::before,.wire::after{content:"";position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(#cfd6dc,#6b747c);z-index:2;box-shadow:0 0 0 1px #000}
.wire::before{top:7px}.wire::after{bottom:7px}
.seg{width:10px;flex:1;border-radius:4px;transition:transform .4s ease;box-shadow:inset -3px 0 0 #0004,inset 2px 0 0 #fff3}
.gap{height:0;transition:height .35s}
.wire.sel .seg{box-shadow:0 0 0 2px var(--cyan),0 0 14px var(--cyan)}
.wire.cut .seg.a{transform:rotate(10deg);transform-origin:top center}
.wire.cut .seg.b{transform:rotate(-12deg);transform-origin:bottom center}
.wire.cut .gap{height:24px}
.wire .mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;background:var(--red);color:#fff;font-family:Orbitron,sans-serif;font-weight:900;font-size:11px;letter-spacing:.08em;
  padding:7px 8px;border-radius:4px;box-shadow:0 0 14px #ff3b3bcc;white-space:nowrap;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 4px #ff3b3b88}}
.wire .ok{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;color:var(--green);font-size:12px;background:#03140b;border:1px solid var(--green);padding:3px 6px;border-radius:3px;letter-spacing:.1em;box-shadow:0 0 10px #39ff9c66}
.hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:7px;letter-spacing:.06em}
.tags{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.tag{display:flex;gap:10px;align-items:center;background:#081013;color:var(--text);border:1px solid var(--line);border-left:4px solid;border-radius:3px;padding:8px 10px;font-size:14.5px;cursor:pointer;line-height:1.4}
.tag.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 14px #22e5ff44}
.tag .who{font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.tag .verdict{margin-left:auto;font-size:11px;padding:3px 6px;border-radius:2px;flex:none;letter-spacing:.1em}
.v-true{color:var(--green);border:1px solid var(--green);text-shadow:0 0 6px #39ff9c99}
.v-lie{color:var(--red);border:1px solid var(--red);text-shadow:0 0 6px #ff3b3b99}
.chip{display:inline-block;padding:0 5px;border-radius:2px;font-weight:700;font-size:13px;line-height:1.45;text-transform:uppercase;letter-spacing:.04em}
.legend{color:var(--muted);font-size:11.5px;margin-top:8px;text-align:center;letter-spacing:.04em}
.btn{display:block;width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:6px;cursor:pointer;font-family:Orbitron,sans-serif;letter-spacing:.12em}
.btn.cut{background:var(--red);color:#fff;box-shadow:0 0 18px #ff3b3b77}
.btn.sec{background:#0c171b;color:var(--cyan);border:1px solid #22e5ff55}
.btn.go{background:var(--cyan);color:#031014;box-shadow:0 0 18px #22e5ff66}
.cutbar{position:sticky;bottom:10px;z-index:4;margin-top:12px}
.cutbar .btn{margin:0;padding:16px;font-size:17px;border:2px solid #000;
  background:repeating-linear-gradient(-45deg,#ffcf20 0 10px,#111 10px 20px);color:#fff}
.cutbar .btn span{background:var(--red);padding:6px 12px;border-radius:4px;box-shadow:0 0 16px #ff3b3b}
.cutbar .btn:disabled{background:#0c1215;border:1px dashed #2d3d44;color:var(--muted);cursor:default;font-size:13px}
.intro{font-size:14.5px;line-height:1.6;margin:14px 2px 4px}
.intro p{margin:0 0 10px}
.intro b{color:var(--cyan)}
.result{margin-top:14px;text-align:center;border-radius:6px;padding:14px}
.result.win{background:#03160c;border:1px solid var(--green);box-shadow:0 0 18px #39ff9c33}
.result.lose{background:#1a0505;border:1px solid var(--red);box-shadow:0 0 18px #ff3b3b33}
.result .big{font-family:Orbitron,sans-serif;font-size:26px;font-weight:900;letter-spacing:.16em}
.result.win .big{color:var(--green);text-shadow:0 0 12px #39ff9c}
.result.lose .big{color:var(--red);text-shadow:0 0 12px #ff3b3b}
.result .small{color:#b9cfca;font-size:13.5px;margin-top:6px}
.explain{font-size:14px;line-height:1.55;margin-top:12px;text-align:center}
.stats{display:flex;justify-content:center;gap:22px;margin-top:12px;color:var(--muted);font-size:11px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.stats b{display:block;font-family:Orbitron,sans-serif;font-size:20px;color:var(--cyan)}
.toast{text-align:center;color:var(--green);font-size:13px;min-height:16px;margin-top:6px}
.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#ffb300 30%,#ff3d00 60%,#000c 100%);opacity:0;pointer-events:none;z-index:9}
.flash.go{animation:boom 1.1s ease-out}
@keyframes boom{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <header><h1>DEF<span>U</span>SE</h1><div class="sub" id="sub"></div></header>
  <div id="game"></div>
</div>
<div class="flash" id="flash"></div>
<script>
const COLORS=[
 {n:'red',h:'#e53935',warm:1},{n:'orange',h:'#fb8c00',warm:1,dark:1},{n:'yellow',h:'#fdd835',warm:1,dark:1},
 {n:'green',h:'#43a047',warm:0},{n:'blue',h:'#1e88e5',warm:0},{n:'purple',h:'#8e24aa',warm:0}];
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function hashStr(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

const dateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const EPOCH=new Date(2026,10,9);
const dayNum=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ---------- puzzle logic ---------- */
const TYPES=[['is',2],['not',2],['next',2],['left',1.5],['right',1.5],['end',1],['notEnd',1],['warm',1],['cool',1],['lies',3],['truth',2]];
const TOT=TYPES.reduce((a,b)=>a+b[1],0);
function randStmt(rng,n,i){
  let r=rng()*TOT,type='is';
  for(const [k,w] of TYPES){if((r-=w)<0){type=k;break}}
  let c=null;
  if(type==='is'||type==='not'||type==='next')c=Math.floor(rng()*n);
  if(type==='left')c=1+Math.floor(rng()*(n-1));
  if(type==='right')c=Math.floor(rng()*(n-1));
  if(type==='lies'||type==='truth'){c=Math.floor(rng()*(n-1));if(c>=i)c++}
  return{type,c};
}
function evalStmt(t,s,truth,wires,n){
  switch(t.type){
    case'is':return s===t.c; case'not':return s!==t.c;
    case'next':return Math.abs(s-t.c)===1;
    case'left':return s<t.c; case'right':return s>t.c;
    case'end':return s===0||s===n-1; case'notEnd':return s!==0&&s!==n-1;
    case'warm':return!!wires[s].warm; case'cool':return!wires[s].warm;
    case'lies':return!truth(t.c); case'truth':return truth(t.c);
  }
}
function solve(p){
  const n=p.wires.length,worlds=[];
  for(let s=0;s<n;s++)for(let m=0;m<(1<<n);m++){
    const truth=i=>!!((m>>i)&1);let ok=true;
    for(let i=0;i<n;i++){if(evalStmt(p.tags[i],s,truth,p.wires,n)!==truth(i)){ok=false;break}}
    if(!ok)continue;
    let cnt=0;for(let i=0;i<n;i++)cnt+=(m>>i)&1;
    if((p.rule==='oneTrue'&&cnt===1)||(p.rule==='oneLie'&&cnt===n-1))worlds.push({s,m});
  }
  return worlds;
}
function makePuzzle(rng,n){
  for(let tries=0;tries<50000;tries++){
    const wires=shuffle(COLORS.slice(),rng).slice(0,n);
    const rule=rng()<.5?'oneTrue':'oneLie';
    const tags=[];for(let i=0;i<n;i++)tags.push(randStmt(rng,n,i));
    if(new Set(tags.map(t=>t.type+t.c)).size<n)continue;
    const hasRef=tags.some(t=>t.type==='lies'||t.type==='truth');
    if(!hasRef&&rng()<.7)continue;
    const w=solve({wires,rule,tags});
    if(w.length===1)return{wires,rule,tags,answer:w[0].s,mask:w[0].m};
  }
}

/* ---------- rendering helpers ---------- */
function chip(i){const w=G.wires[i];return`<span class="chip" style="background:${w.h};color:${w.dark?'#222':'#fff'}">${w.n}</span>`}
function stmtText(t){
  switch(t.type){
    case'is':return`The ${chip(t.c)} wire is safe.`;
    case'not':return`The ${chip(t.c)} wire is NOT safe.`;
    case'next':return`The safe wire is right next to ${chip(t.c)}.`;
    case'left':return`The safe wire is somewhere left of ${chip(t.c)}.`;
    case'right':return`The safe wire is somewhere right of ${chip(t.c)}.`;
    case'end':return`The safe wire is at one of the ends.`;
    case'notEnd':return`The safe wire is not at either end.`;
    case'warm':return`The safe wire is a warm color.`;
    case'cool':return`The safe wire is a cool color.`;
    case'lies':return`The ${chip(t.c)} tag is lying.`;
    case'truth':return`The ${chip(t.c)} tag is telling the truth.`;
  }
}

/* ---------- game state ---------- */
let G=null,timerId=null;
function newGame(mode){
  clearInterval(timerId);
  const d=new Date(),date=dateStr(d);
  const seed=mode==='daily'?'defuse-'+date:'practice-'+Math.random();
  const rng=mulberry32(hashStr(seed));
  const n=4;
  G={mode,date,num:dayNum(d),dow:d.getDay(),n,...makePuzzle(rng,n),phase:'ready',sel:null,cutIdx:null,used:0};
  G.limit=120;
  if(mode==='daily'){const sv=store.get('defuse-'+date);if(sv){G.phase=sv.result;G.used=sv.time;G.cutIdx=sv.cut;G.reason=sv.reason}}
  render();
}
function start(){
  G.phase='playing';G.t0=Date.now();render();
  timerId=setInterval(tick,200);
}
function left(){return Math.max(0,G.limit-(Date.now()-G.t0)/1000)}
function tick(){
  const l=left(),el=$('#timer');
  if(el){el.textContent=fmt(Math.ceil(l));el.classList.toggle('low',l<=20)}
  if(l<=0)finish(false,'time');
}
function select(i){if(G.phase!=='playing')return;G.sel=i;render()}
function cut(){
  if(G.phase!=='playing'||G.sel===null)return;
  const i=G.sel;G.phase='cutting';G.cutIdx=i;clearInterval(timerId);
  G.used=(Date.now()-G.t0)/1000;
  const w=document.querySelector(`.wire[data-i="${i}"]`);
  if(w){w.classList.remove('sel');w.classList.add('cut');const m=w.querySelector('.mark');if(m)m.remove()}
  $('#cutBtn').disabled=true;$('#cutBtn').textContent='✂ ✂ ✂';
  setTimeout(()=>finish(i===G.answer,'wire'),900);
}
function finish(won,reason){
  clearInterval(timerId);
  if(G.phase==='won'||G.phase==='lost')return;
  if(reason==='time')G.used=G.limit;
  G.phase=won?'won':'lost';G.reason=reason;G.sel=null;
  if(G.mode==='daily'){
    store.set('defuse-'+G.date,{result:G.phase,time:G.used,cut:G.cutIdx,reason});
    const st=store.get('defuse-stats')||{played:0,wins:0,streak:0,best:0,last:null};
    const y=new Date();y.setDate(y.getDate()-1);
    st.played++;
    if(won){st.wins++;st.streak=st.last===dateStr(y)?st.streak+1:1;st.best=Math.max(st.best,st.streak);st.last=G.date}
    else{st.streak=0;st.last=G.date}
    store.set('defuse-stats',st);
  }
  render();
  if(!won){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');const b=$('.bomb');b.classList.add('shake')}
}
function share(){
  const txt=G.phase==='won'
    ?`💣 DEFUSE #${G.num}\n✂️ Defused in ${fmt(G.used)} 🟢`
    :`💣 DEFUSE #${G.num}\n💥 BOOM${G.reason==='time'?' (out of time)':''} 🔴`;
  const done=()=>{$('#toast').textContent='Copied — paste it in WhatsApp!'};
  try{navigator.clipboard.writeText(txt).then(done,()=>{$('#toast').textContent='Couldn’t copy — long-press to copy instead.'})}catch(e){$('#toast').textContent='Couldn’t copy here.'}
}

function render(){
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  $('#sub').textContent=G.mode==='daily'?`BOMB #${String(G.num).padStart(3,'0')} · ${days[G.dow]}`:`PRACTICE MODE`;
  const app=$('#game');
  if(G.phase==='ready'){
    app.innerHTML=`<div class="bomb">
      <div class="topbar"><div class="status"><div class="led"></div>ARMED</div><div class="timer">${fmt(G.limit)}</div></div>
      <div class="intro">
        <p>&gt; A bomb with <b>4 wires</b>. Each wire has a tag with a note on it.</p>
        <p>&gt; Some notes are <b>lies</b>. The bomb tells you how many.</p>
        <p>&gt; Find the safe wire and cut it. <b>One cut. No second chances.</b></p>
      </div>
      <button class="btn go" id="startBtn">▶ START THE CLOCK</button>
    </div>`;
    $('#startBtn').onclick=start;return;
  }
  const over=G.phase==='won'||G.phase==='lost';
  const ruleTxt=G.rule==='oneTrue'?'Only <b>ONE</b> tag tells the truth. All the others are lying.':'Only <b>ONE</b> tag is lying. All the others tell the truth.';
  const timeTxt=over?fmt(G.phase==='won'?G.limit-G.used:0):fmt(Math.ceil(G.phase==='playing'?left():G.limit-G.used));
  const wires=G.wires.map((w,i)=>`<div class="wire ${G.sel===i?'sel':''} ${G.cutIdx===i?'cut':''}" data-i="${i}">
      <div class="seg a" style="background:${w.h}"></div><div class="gap"></div><div class="seg b" style="background:${w.h}"></div>
      ${!over&&G.sel===i?'<div class="mark">✂ CUT</div>':''}${over&&i===G.answer?'<div class="ok">SAFE</div>':''}</div>`).join('');
  const tags=G.tags.map((t,i)=>{const tr=(G.mask>>i)&1;return`<div class="tag ${!over&&G.sel===i?'sel':''}" data-i="${i}" style="border-left-color:${G.wires[i].h}">
      <div><div class="who">tag_0${i+1} · ${G.wires[i].n} wire</div><div class="stmt">“${stmtText(t)}”</div></div>
      ${over?`<span class="verdict ${tr?'v-true':'v-lie'}">${tr?'TRUE':'LIE'}</span>`:''}</div>`}).join('');
  const usesTemp=G.tags.some(t=>t.type==='warm'||t.type==='cool');
  let bottom='';
  if(!over){
    bottom=`<div class="cutbar"><button class="btn" id="cutBtn" ${G.sel===null?'disabled':''}>${G.sel===null?'TAP A WIRE TO SELECT IT':`<span>✂ CUT ${G.wires[G.sel].n.toUpperCase()}</span>`}</button></div>`;
  }else{
    let odd=0;for(let i=0;i<G.n;i++)if(((G.mask>>i)&1)===(G.rule==='oneTrue'?1:0))odd=i;
    const why=G.rule==='oneTrue'?`Only the ${chip(odd)} tag was telling the truth`:`Only the ${chip(odd)} tag was lying`;
    const st=store.get('defuse-stats');
    bottom=`<div class="result ${G.phase==='won'?'win':'lose'}">
        <div class="big">${G.phase==='won'?'DEFUSED':'💥 BOOM'}</div>
        <div class="small">${G.phase==='won'?`Cut in ${fmt(G.used)} · ${fmt(G.limit-G.used)} left on the clock`:(G.reason==='time'?'You ran out of time.':`The ${G.wires[G.cutIdx].n} wire was the wrong one.`)}</div>
      </div>
      <div class="explain">${why}, so the safe wire was ${chip(G.answer)}.</div>
      ${G.mode==='daily'&&st?`<div class="stats"><div><b>${st.played}</b>played</div><div><b>${st.wins}</b>defused</div><div><b>${st.streak}</b>streak</div><div><b>${st.best}</b>best</div></div>`:''}
      ${G.mode==='daily'?`<button class="btn go" id="shareBtn">⧉ COPY RESULT</button><div class="toast" id="toast"></div><div class="legend">New bomb tomorrow.</div>`:''}
      <button class="btn sec" id="practiceBtn">⟳ ${G.mode==='daily'?'PRACTICE BOMB':'ANOTHER PRACTICE BOMB'}</button>
      ${G.mode==='practice'?`<button class="btn sec" id="dailyBtn">◂ TODAY'S BOMB</button>`:''}`;
  }
  const stCls=G.phase==='won'?'ok':G.phase==='lost'?'dead':'';
  const stTxt=G.phase==='won'?'SAFE':G.phase==='lost'?'OFFLINE':'ARMED';
  app.innerHTML=`<div class="bomb">
      <div class="topbar"><div class="status ${stCls}"><div class="led"></div>${stTxt}</div><div class="timer ${G.phase==='won'?'ok':''}" id="timer">${timeTxt}</div></div>
      <div class="rule"><div class="h">// RULE</div>${ruleTxt}</div>
      <div class="board"><div class="wires">${wires}</div></div>
      ${!over?`<div class="hint">${G.sel===null?'Tap a wire or a tag to select it':'Tap the wire again or hit the button to cut'}</div>`:''}
      <div class="tags">${tags}</div>
      ${usesTemp?'<div class="legend">WARM = red · orange · yellow &nbsp;|&nbsp; COOL = green · blue · purple</div>':''}
    </div>${bottom}`;
  document.querySelectorAll('.wire').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(G.phase==='playing'&&G.sel===i)cut();else select(i)});
  document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>select(+el.dataset.i));
  const c=$('#cutBtn');if(c)c.onclick=cut;
  const s=$('#shareBtn');if(s)s.onclick=share;
  const p=$('#practiceBtn');if(p)p.onclick=()=>newGame('practice');
  const d=$('#dailyBtn');if(d)d.onclick=()=>newGame('daily');
}
newGame('daily');
</script>
</body>
</html>
